name: Build all platforms

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/NamesMiner.apk
          cd out && zip NamesMiner-Android-APK.zip NamesMiner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz

  release:
    needs: [android, desktop]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add browser version
        run: cp desktop/index.html artifacts/NamesMiner-Web.html && ls -la artifacts
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest artifacts/* \
            --title "Names Miner – latest builds" \
            --notes "Android: NamesMiner.apk (or the APK zip). Windows: NamesMiner-Windows-Setup.exe (installer), NamesMiner-Windows-Portable.exe (no install) or NamesMiner-Windows.zip. Linux: NamesMiner-Linux.AppImage, .deb or .tar.gz. Any device: NamesMiner-Web.html opens in a browser. Built from ${{ github.sha }}."
