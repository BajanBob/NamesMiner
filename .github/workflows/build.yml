name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NamesMiner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NamesMiner-apk
          path: NamesMiner.apk

      - name: Publish to Releases (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NamesMiner.apk \
            --title "Names Miner – latest build" \
            --notes "Built from ${{ github.sha }}. Download NamesMiner.apk on your phone and open it to install."
